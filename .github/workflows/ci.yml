name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ROOT: ${{ github.workspace }}/build
  COCOTB_BUILD_ROOT: ${{ github.workspace }}/build
  OSS_CAD_SUITE_VERSION: "2026-08-01"

jobs:
  test:
    name: RTL and model tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install --requirement requirements-dev.txt
      - run: make PYTHON=python ci
